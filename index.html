<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="only light">
<meta name="description" content="คิดเงินค่าไข่ตามเบอร์ สำหรับเขียนบิลเงินสด">
<title>คิดเงินไข่</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/sarabun-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/sarabun-thai-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: Sarabun; font-weight: 400; font-display: swap;
    src: url(fonts/sarabun-thai-400.woff2) format("woff2");
    unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
  }
  @font-face {
    font-family: Sarabun; font-weight: 700; font-display: swap;
    src: url(fonts/sarabun-thai-700.woff2) format("woff2");
    unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
  }
  @font-face {
    font-family: Sarabun; font-weight: 400; font-display: swap;
    src: url(fonts/sarabun-latin-400.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: Sarabun; font-weight: 700; font-display: swap;
    src: url(fonts/sarabun-latin-700.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #5f5f5f;
    --dash: #a6a6a6;
    --line: #dddddd;
    --sel: #1d4ed8;
    --sel-down: #163a9e;
    --sel-row: #eef3ff;
    --edit: #ffe066;
    --edit-edge: #c99a00;
    --warn: #c62828;
    --key: #eceef1;
    --key-down: #c3c9d2;
    --undo: #d9480f;

    --vh: 100vh;
    --bar: 0px;  /* LINE's in-app browser draws its toolbar over the bottom of the page */
    /* One design pixel. The screen is drawn for 412 × 720 and scaled to fit, so nothing falls off a smaller phone. */
    --u: min(
      calc(min(100vw, 520px) / 412),
      calc((var(--vh) - var(--bar) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) / 720)
    );
    /* One design pixel of text. --fs undoes the phone's font-size setting (set from JS). */
    --fs: 1;
    --t: calc(var(--u) * var(--fs));
  }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }
  html.line { --bar: 56px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: Sarabun, "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; padding: 0; }
  /* --fit is set from JS only when text is still wider or taller than its box. */
  .fit { white-space: nowrap; }

  .app {
    height: var(--vh);
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 0 calc(12 * var(--u)) calc(env(safe-area-inset-bottom, 0px) + var(--bar));
  }
  /* Boxes take their size from the layout, never from their text; fitText() shrinks text to the box. */
  .app > * { min-height: 0; }

  /* Header: date, or the yellow "editing price" warning. Same height either way, so nothing jumps. */
  header {
    flex: 0 0 calc(52 * var(--u) + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: stretch;
    gap: calc(8 * var(--u));
    margin: 0 calc(-12 * var(--u));
    padding: env(safe-area-inset-top, 0px) calc(12 * var(--u)) 0;
    border-bottom: 1px solid var(--line);
  }
  header.editing { background: var(--edit); border-bottom-color: var(--edit-edge); }
  #title {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    font-size: calc(26 * var(--t) * var(--fit, 1));
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  #newBill {
    flex: none;
    align-self: center;
    width: calc(116 * var(--u));
    height: calc(44 * var(--u));
    padding: 0 calc(8 * var(--u));
    font-size: calc(23 * var(--t) * var(--fit, 1));
    font-weight: 700;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: calc(10 * var(--u));
  }
  #newBill.down { background: var(--key-down); }
  #newBill.undo.down { background: #a8370b; }
  #newBill.undo { background: var(--undo); border-color: var(--undo); color: #fff; }

  /* Table. Column shares are sized for 9,999 / 999 / 9,989,001 at full size. */
  .cols, .row {
    display: grid;
    grid-template-columns: minmax(0, 44fr) minmax(0, 100fr) minmax(0, 84fr) minmax(0, 148fr);
    grid-template-rows: minmax(0, 1fr);
    column-gap: calc(4 * var(--u));
  }
  .cols > *, .row > * { display: flex; align-items: center; min-width: 0; }
  .size { justify-content: center; }
  .price, .amt { justify-content: flex-end; }
  .qty { justify-content: center; }

  .cols { flex: 0 0 calc(28 * var(--u)); color: var(--muted); }
  .cols > * {
    padding: 0 calc(3px + 7 * var(--u));
    font-size: calc(18 * var(--t) * var(--fit, 1));
  }
  .cols > .size { padding: 0; }

  .rows { flex: 1 1 calc(6 * 46 * var(--u)); min-height: 0; display: flex; flex-direction: column; }
  .row {
    flex: 1 1 0;
    min-height: 0;
    border-top: 1px solid var(--line);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .row > * { font-size: calc(31 * var(--t) * var(--fit, 1)); }
  .row.active { background: var(--sel-row); }
  .row > .cell {
    margin: calc(3 * var(--u)) 0;
    padding: 0 calc(7 * var(--u));
    border: 3px solid transparent;
    border-radius: calc(9 * var(--u));
  }
  .qty.sel { border-color: var(--sel); background: #fff; }
  .price.sel { border-color: var(--edit-edge); background: var(--edit); }
  .empty { color: var(--dash); font-weight: 400; }
  .row > .amt.warn { color: var(--warn); font-size: calc(21 * var(--t) * var(--fit, 1)); }

  /* Total */
  .total {
    flex: 0 0 calc(66 * var(--u));
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
    grid-template-rows: minmax(0, 1fr);
    gap: calc(8 * var(--u));
    border-top: 3px solid var(--ink);
  }
  .count, .sum { display: flex; align-items: center; }
  .count {
    font-size: calc(20 * var(--t) * var(--fit, 1));
    line-height: 1.2;
    color: var(--muted);
  }
  .count b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .sum {
    justify-content: flex-end;
    font-size: calc(46 * var(--t) * var(--fit, 1));
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .sum .unit { font-size: calc(24 * var(--t) * var(--fit, 1)); }

  /* Keypad */
  .pad {
    flex: 1 1 calc(298 * var(--u));
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
    grid-template-areas:
      "k7 k8 k9 bs"
      "k4 k5 k6 up"
      "k1 k2 k3 nx"
      "k0 k0 cl nx";
    gap: calc(8 * var(--u));
    padding: calc(8 * var(--u)) 0 calc(10 * var(--u));
  }
  .pad button {
    min-width: 0;
    border: 0;
    border-radius: calc(12 * var(--u));
    background: var(--key);
    font-size: calc(38 * var(--t) * var(--fit, 1));
    font-weight: 700;
    line-height: 1;
  }
  .pad button.down { background: var(--key-down); }
  .pad .cl { color: var(--warn); }
  .pad .nav { font-size: calc(30 * var(--t) * var(--fit, 1)); }
  .pad .nx {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(6 * var(--u));
    background: var(--sel);
    color: #fff;
    font-size: calc(26 * var(--t) * var(--fit, 1));
  }
  .pad .nx span { font-size: calc(30 * var(--t) * var(--fit, 1)); }
  .pad .nx.down { background: var(--sel-down); }

  /* Measures how much the phone enlarges text: 100px tall unless the font-size setting changes it. */
  .probe { flex: none; height: 0; overflow: hidden; visibility: hidden; }
  #probe { font-size: 100px; line-height: 1; }
</style>
</head>
<body>
<div class="app">
  <header id="header">
    <div id="title" class="fit"></div>
    <button id="newBill" type="button" class="fit">บิลใหม่</button>
  </header>

  <div class="cols" aria-hidden="true">
    <div class="size fit">เบอร์</div>
    <div class="price fit">ราคา</div>
    <div class="qty fit">แผง</div>
    <div class="amt fit">เงิน</div>
  </div>
  <div class="rows" id="rows"></div>

  <div class="total">
    <div class="count fit"><span>รวม<br><b id="count"></b> แผง</span></div>
    <div class="sum fit"><span><span id="sum"></span> <span class="unit">บาท</span></span></div>
  </div>

  <div class="pad" id="pad">
    <button type="button" data-k="7" style="grid-area:k7" class="fit">7</button>
    <button type="button" data-k="8" style="grid-area:k8" class="fit">8</button>
    <button type="button" data-k="9" style="grid-area:k9" class="fit">9</button>
    <button type="button" data-k="bs" style="grid-area:bs" class="nav fit" aria-label="ลบ">⌫</button>
    <button type="button" data-k="4" style="grid-area:k4" class="fit">4</button>
    <button type="button" data-k="5" style="grid-area:k5" class="fit">5</button>
    <button type="button" data-k="6" style="grid-area:k6" class="fit">6</button>
    <button type="button" data-k="up" style="grid-area:up" class="nav fit" aria-label="ขึ้น">▲</button>
    <button type="button" data-k="1" style="grid-area:k1" class="fit">1</button>
    <button type="button" data-k="2" style="grid-area:k2" class="fit">2</button>
    <button type="button" data-k="3" style="grid-area:k3" class="fit">3</button>
    <button type="button" data-k="down" style="grid-area:nx" class="nx fit">ถัดไป<span>▼</span></button>
    <button type="button" data-k="0" style="grid-area:k0" class="fit">0</button>
    <button type="button" data-k="c" style="grid-area:cl" class="cl fit">C</button>
  </div>

  <div class="probe" aria-hidden="true"><div id="probe">0</div></div>
</div>

<script>
(() => {
  "use strict";

  const SIZES = 6;
  const MAX = { qty: 999, price: 9999 };
  const STORAGE_KEY = "khai:v1";
  const UNDO_MS = 10000;
  // Ignore taps on เอาคืน right after it appears, so a double-tap on บิลใหม่ doesn't undo itself.
  const UNDO_GUARD_MS = 600;

  const fmt = new Intl.NumberFormat("en-US");

  // ---------- LINE ----------

  // LINE's in-app browser covers the keypad's bottom row with its toolbar. Ask LINE to hand the page
  // to the phone's own browser; if it ignores that, leave room for the toolbar instead.
  const EXTERNAL = "openExternalBrowser";
  const url = new URL(location.href);
  if (/\bLine\/\d/i.test(navigator.userAgent)) {
    document.documentElement.classList.add("line");
    if (!url.searchParams.has(EXTERNAL)) {
      url.searchParams.set(EXTERNAL, "1");
      location.replace(url.href);
    }
  } else if (url.searchParams.has(EXTERNAL)) {
    // Drop the flag so Add to Home screen saves the plain address.
    url.searchParams.delete(EXTERNAL);
    history.replaceState(null, "", url.href);
  }

  const state = {
    prices: Array(SIZES).fill(0),
    qty: Array(SIZES).fill(0),
    col: "qty",   // "qty" | "price"
    row: 0,
    fresh: true,  // next digit replaces the cell instead of appending
  };
  let undo = null;
  let undoTimer = 0;
  let undoShownAt = 0;

  // ---------- storage ----------

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!s) return;
      const valid = (a, max) => Array.isArray(a) && a.length === SIZES &&
        a.every((n) => Number.isInteger(n) && n >= 0 && n <= max);
      if (valid(s.prices, MAX.price)) state.prices = s.prices;
      if (valid(s.qty, MAX.qty)) state.qty = s.qty;
      if (s.col === "qty" || s.col === "price") state.col = s.col;
      if (Number.isInteger(s.row) && s.row >= 0 && s.row < SIZES) state.row = s.row;
    } catch (e) { /* storage unavailable or corrupt: start empty */ }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        prices: state.prices, qty: state.qty, col: state.col, row: state.row,
      }));
    } catch (e) { /* keep working for this session */ }
  }

  // ---------- view ----------

  const $ = (id) => document.getElementById(id);
  const headerEl = $("header");
  const titleEl = $("title");
  const newBillEl = $("newBill");
  const rowsEl = $("rows");
  const countEl = $("count");
  const sumEl = $("sum");
  const padEl = $("pad");
  const probeEl = $("probe");

  const cells = [];
  for (let i = 0; i < SIZES; i++) {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.row = String(i);
    row.innerHTML =
      `<div class="size fit">${i}</div>` +
      `<div class="cell price fit"></div>` +
      `<div class="cell qty fit"></div>` +
      `<div class="cell amt fit"></div>`;
    rowsEl.append(row);
    cells.push({ row, price: row.children[1], qty: row.children[2], amt: row.children[3] });
  }
  const fitEls = [...document.querySelectorAll(".fit")];
  const range = document.createRange();

  // Android's font-size setting (which LINE's browser follows) enlarges text up to ~1.7× without
  // growing the boxes around it. Measure the boost on a 100px probe and undo it.
  function undoFontBoost() {
    const boost = probeEl.getBoundingClientRect().height / 100;
    if (!(boost > 0)) return;  // not laid out
    const fs = Math.abs(boost - 1) < 0.02 ? 1 : 1 / Math.min(3, Math.max(0.5, boost));
    document.documentElement.style.setProperty("--fs", fs.toFixed(3));
  }

  // Last guard: shrink any text that is still wider or taller than its box (huge amounts, a fallback
  // font, a boost we couldn't measure). Reads all, then writes all, so it costs one extra layout.
  function fitText() {
    for (const el of fitEls) el.style.removeProperty("--fit");
    // Text height per px of font size, to turn a measured text height back into a font size.
    range.selectNodeContents(probeEl);
    const textPerFont = range.getBoundingClientRect().height / probeEl.getBoundingClientRect().height || 1.3;
    const scales = fitEls.map((el) => {
      range.selectNodeContents(el);
      const text = range.getBoundingClientRect();
      const cs = getComputedStyle(el);
      const roomW = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const roomH = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const font = text.height / textPerFont;
      return Math.max(0.3, Math.min(1,
        text.width > roomW ? (roomW / text.width) * 0.97 : 1,
        font > roomH + 1 ? roomH / font : 1));
    });
    fitEls.forEach((el, i) => {
      if (scales[i] < 1) el.style.setProperty("--fit", scales[i].toFixed(3));
    });
  }

  function thaiDate() {
    const d = new Date();
    const two = (n) => String(n).padStart(2, "0");
    return `${two(d.getDate())}/${two(d.getMonth() + 1)}/${two((d.getFullYear() + 543) % 100)}`;
  }

  function showNumber(el, n) {
    el.textContent = n > 0 ? fmt.format(n) : "–";
    el.classList.toggle("empty", n === 0);
  }

  function render() {
    let totalQty = 0;
    let total = 0;

    for (let i = 0; i < SIZES; i++) {
      const c = cells[i];
      const p = state.prices[i];
      const q = state.qty[i];
      const amount = p * q;

      showNumber(c.price, p);
      showNumber(c.qty, q);

      c.amt.classList.remove("empty", "warn");
      if (q === 0) {
        c.amt.textContent = "–";
        c.amt.classList.add("empty");
      } else if (p === 0) {
        c.amt.textContent = "ใส่ราคา";
        c.amt.classList.add("warn");
      } else {
        c.amt.textContent = fmt.format(amount);
      }

      totalQty += q;
      total += amount;

      const active = i === state.row;
      c.row.classList.toggle("active", active);
      c.qty.classList.toggle("sel", active && state.col === "qty");
      c.price.classList.toggle("sel", active && state.col === "price");
    }

    countEl.textContent = fmt.format(totalQty);
    sumEl.textContent = fmt.format(total);

    const editingPrice = state.col === "price";
    headerEl.classList.toggle("editing", editingPrice);
    titleEl.textContent = editingPrice ? `กำลังแก้ราคา เบอร์ ${state.row}` : thaiDate();

    newBillEl.textContent = undo ? "เอาคืน" : "บิลใหม่";
    newBillEl.classList.toggle("undo", !!undo);

    fitText();
  }

  function commit() {
    render();
    save();
  }

  // ---------- actions ----------

  function select(col, row) {
    state.col = col;
    state.row = row;
    state.fresh = true;
  }

  function activeValues() {
    return state.col === "qty" ? state.qty : state.prices;
  }

  function typeDigit(d) {
    const values = activeValues();
    const next = (state.fresh ? 0 : values[state.row]) * 10 + d;
    if (next <= MAX[state.col]) values[state.row] = next;
    state.fresh = false;
  }

  function backspace() {
    const values = activeValues();
    values[state.row] = Math.floor(values[state.row] / 10);
    state.fresh = false;
  }

  function clearCell() {
    activeValues()[state.row] = 0;
    state.fresh = false;
  }

  function move(delta) {
    select(state.col, Math.min(SIZES - 1, Math.max(0, state.row + delta)));
  }

  function endUndo() {
    undo = null;
    clearTimeout(undoTimer);
  }

  function newBill() {
    if (undo) {
      if (Date.now() - undoShownAt < UNDO_GUARD_MS) return;
      state.qty = undo.qty;
      select(undo.col, undo.row);
      endUndo();
      return;
    }
    if (state.qty.some((q) => q > 0)) {
      undo = { qty: state.qty.slice(), col: state.col, row: state.row };
      undoShownAt = Date.now();
      undoTimer = setTimeout(() => { endUndo(); render(); }, UNDO_MS);
    }
    state.qty = Array(SIZES).fill(0);
    select("qty", 0);
  }

  function press(key) {
    if (undo) endUndo();
    if (/^\d$/.test(key)) typeDigit(Number(key));
    else if (key === "bs") backspace();
    else if (key === "c") clearCell();
    else if (key === "up") move(-1);
    else if (key === "down") move(1);
    commit();
  }

  function buzz() {
    try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) { /* unsupported */ }
  }

  // ---------- input ----------

  padEl.addEventListener("pointerdown", (e) => {
    const btn = e.target.closest("button[data-k]");
    if (!btn) return;
    e.preventDefault();
    buzz();
    btn.classList.add("down");
    press(btn.dataset.k);
  });
  const release = () => {
    for (const btn of padEl.querySelectorAll(".down")) btn.classList.remove("down");
  };
  padEl.addEventListener("pointerup", release);
  padEl.addEventListener("pointercancel", release);
  padEl.addEventListener("pointerleave", release);

  rowsEl.addEventListener("pointerdown", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    e.preventDefault();
    buzz();
    select(e.target.closest(".price") ? "price" : "qty", Number(row.dataset.row));
    commit();
  });

  // Manual pressed state: :active sticks on Android once the keypad cancels pointer defaults.
  newBillEl.addEventListener("pointerdown", () => newBillEl.classList.add("down"));
  for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
    newBillEl.addEventListener(type, () => newBillEl.classList.remove("down"));
  }
  newBillEl.addEventListener("click", () => {
    buzz();
    newBill();
    commit();
  });

  // Physical keyboard, handy when testing on a computer.
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      if (undo) endUndo();
      select(e.key === "ArrowLeft" ? "price" : "qty", state.row);
      commit();
      return;
    }
    const map = { Backspace: "bs", Delete: "c", Escape: "c", ArrowUp: "up", ArrowDown: "down", Enter: "down" };
    const key = /^\d$/.test(e.key) ? e.key : map[e.key];
    if (!key) return;
    e.preventDefault();
    press(key);
  });

  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // ---------- keep screen on ----------

  let wakeLock = null;
  async function keepAwake() {
    if (wakeLock || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) { /* denied or unsupported: screen just times out normally */ }
  }
  document.addEventListener("visibilitychange", () => {
    keepAwake();
    if (document.visibilityState === "visible") { undoFontBoost(); render(); }
  });
  document.addEventListener("pointerdown", keepAwake);

  // Keep the date right if the app stays open past midnight.
  setInterval(render, 30000);

  addEventListener("resize", () => { undoFontBoost(); render(); });
  // Sarabun arrives after the first paint and is narrower or wider than the fallback.
  if (document.fonts) document.fonts.addEventListener("loadingdone", render);

  load();
  undoFontBoost();
  render();
  keepAwake();
})();
</script>
</body>
</html>
